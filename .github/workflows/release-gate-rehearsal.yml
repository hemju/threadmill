name: Release gate rehearsal

# Runs exactly what the Release workflow runs before it publishes — the
# dependency scan and the full productionCheck gauntlet — on the same runner
# image, but stops short of signing or uploading anything.
#
# Cut a release tag only after this is green. productionCheck is otherwise
# never exercised in CI: the CI workflow runs check, the dependency scan, and
# the browser suite, while the simulations and the soak regression live only
# inside productionCheck. Tagging is the wrong place to discover that the gate
# does not survive a shared runner, because a failed tag burns a version.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    name: Rehearse the release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: threadmill-dashboard-ui/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up OSV Scanner
        uses: ./.github/actions/setup-osv-scanner

      - name: Install dashboard dependencies
        run: ./gradlew :threadmill-dashboard-ui:npmInstall

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('threadmill-dashboard-ui/package-lock.json') }}

      - name: Install Chromium
        working-directory: threadmill-dashboard-ui
        run: npx playwright install --with-deps chromium

      - name: Scan locked dependencies
        run: ./gradlew dependencySecurityScan -PdependencyScanRequired=true --stacktrace

      - name: Run the production gate
        run: ./gradlew productionCheck --stacktrace

      - name: Upload gate failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-rehearsal-failure
          path: |
            threadmill-simulation/build/simulation/**
            threadmill-soak/build/soak/**
            threadmill-dashboard-ui/build/playwright-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
