name: Set up OSV Scanner
description: Install the checksum-verified OSV Scanner version used by dependency gates

runs:
  using: composite
  steps:
    - name: Download and verify OSV Scanner v2.5.0
      shell: bash
      env:
        OSV_SCANNER_VERSION: v2.5.0
        OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
      run: |
        scanner="${RUNNER_TEMP}/osv-scanner"
        curl --fail --location --silent --show-error \
          --output "${scanner}" \
          "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
        printf '%s  %s\n' "${OSV_SCANNER_SHA256}" "${scanner}" | sha256sum --check -
        chmod +x "${scanner}"
        printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
